# QueueNameResolver configuration defaults
# Override via system properties (highest precedence) or environment variables.
# Endpoint URLs are omitted -- they must be set per environment.

codesnap.queue.default.suffix=_queue
codesnap.queue.prefix.to.remove=OCP.DEV.
codesnap.queue.max.endpoint.attempts=3
codesnap.queue.initial.backoff.ms=200
codesnap.queue.http.timeout.seconds=2
codesnap.scanner.version=0
